[package]
name = "envsync-plugin-host"
description = "EnvSync 插件 Host 的隔离、验签、审批与撤销状态机"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
test-support = ["dep:nix", "dep:tempfile"]

[dependencies]
blake3.workspace = true
cap-primitives.workspace = true
envsync-core.workspace = true
envsync-crypto.workspace = true
envsync-domain.workspace = true
envsync-platform.workspace = true
envsync-plugin-api.workspace = true
envsync-policy.workspace = true
nix = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
base64.workspace = true
envsync-plugin-host = { path = ".", features = ["test-support"] }

[[bin]]
name = "envsync-plugin-runner"
path = "src/bin/envsync-plugin-runner.rs"
required-features = ["test-support"]
