[workspace]
resolver = "2"
members = [
    "crates/envsync-domain",
    "crates/envsync-backend",
    "crates/envsync-platform",
    "crates/envsync-storage",
    "crates/envsync-core",
    "crates/envsync-cli",
    # 端到端验收套件：只依赖真实 CLI 二进制，不被其他 crate 依赖。
    "crates/envsync-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/envsync/envsync"
authors = ["EnvSync Contributors"]

# 统一依赖版本：所有 crate 通过 `workspace = true` 引用，避免版本漂移。
[workspace.dependencies]
envsync-domain = { path = "crates/envsync-domain", version = "0.1.0" }
envsync-backend = { path = "crates/envsync-backend", version = "0.1.0" }
envsync-platform = { path = "crates/envsync-platform", version = "0.1.0" }
envsync-storage = { path = "crates/envsync-storage", version = "0.1.0" }
envsync-core = { path = "crates/envsync-core", version = "0.1.0" }

blake3 = "1"
cap-std = "3"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

tempfile = "3"
proptest = "1"
insta = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.test]
opt-level = 1
