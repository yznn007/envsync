name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 保证测试可复现：禁止隐式并行度差异导致的时序偶发。
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # 检测可选组件。hashFiles() 不能用于 job 级 if，因此先通过 job output
  # 把文件是否存在传给后续桌面端 job。
  # ---------------------------------------------------------------------------
  detect:
    name: 检测可选组件
    runs-on: ubuntu-latest
    outputs:
      desktop_ui: ${{ steps.desktop-ui.outputs.present }}
    steps:
      - uses: actions/checkout@v4
      - id: desktop-ui
        shell: bash
        run: |
          if test -f apps/desktop-ui/package.json; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # 格式与静态检查：只需在一个平台跑，失败即快速反馈。
  # ---------------------------------------------------------------------------
  lint:
    name: 格式与 Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: 安装桌面端所需系统库
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # 三平台测试矩阵。设计文档要求 Linux / macOS / Windows 全部通过。
  # ---------------------------------------------------------------------------
  test:
    name: 测试 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装桌面端所需系统库（仅 Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - run: cargo test --workspace
      - run: cargo test --workspace --doc

  # ---------------------------------------------------------------------------
  # 桌面前端：lint / typecheck / 单元测试 / 构建。
  # ---------------------------------------------------------------------------
  desktop-ui:
    name: 桌面前端
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.desktop_ui == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop-ui/pnpm-lock.yaml
      - run: pnpm --dir apps/desktop-ui install --frozen-lockfile
      - run: pnpm --dir apps/desktop-ui lint
      - run: pnpm --dir apps/desktop-ui typecheck
      - run: pnpm --dir apps/desktop-ui test
      - run: pnpm --dir apps/desktop-ui build

  # ---------------------------------------------------------------------------
  # 依赖审计：不作为合并阻塞，但每次都要有记录。
  # ---------------------------------------------------------------------------
  audit:
    name: 依赖审计
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit
