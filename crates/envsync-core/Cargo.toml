[package]
name = "envsync-core"
description = "EnvSync 核心服务：捕获、计划、应用、恢复"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
envsync-domain.workspace = true
envsync-backend.workspace = true
envsync-crypto.workspace = true
envsync-platform.workspace = true
envsync-storage.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
similar.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
# 让测试目标拿到 `InMemorySecureStore`；`cargo build` 不会打开这个 feature，
# 因此测试替身不可能泄漏进生产构建。
envsync-platform = { workspace = true, features = ["test-support"] }
